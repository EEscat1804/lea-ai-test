[project]
name = "lea-ai"
version = "0.1.0"
description = "LEA AI brain — Vault intake, guardrails, persona orchestration. Called by lea-be-core."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "S", "A", "C4", "PT", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PT"]
# rules.py and router.py contain user-facing response copy with intentional
# typography (curly quotes, em-dashes, multiplication sign). Don't flag those.
"src/guardrails/rules.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/guardrails/router.py" = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true


[[tool.mypy.overrides]]
# Target only third-party or un-typed local packages that lack stubs
module = "lib.responses,lib.auth,persona.system_prompts,vault.intake"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"